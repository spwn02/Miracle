name: G5 reference Docker image

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "scripts/ci/check-makefile.py"
      - "scripts/ci/check-build-cache.py"
      - "scripts/ci/test-build-cache-guard.py"
      - ".github/workflows/container.yml"
      - "scripts/ci/verify-reference-toolchain.py"
      - "scripts/ci/verify-container.sh"
      - "scripts/ci/verify-docker-workspace.sh"
      - "scripts/ci/verify-nvim-lsp.lua"
      - "scripts/ci/check-docker.py"
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "scripts/ci/check-makefile.py"
      - "scripts/ci/check-build-cache.py"
      - "scripts/ci/test-build-cache-guard.py"
      - ".github/workflows/container.yml"
      - "scripts/ci/verify-reference-toolchain.py"
      - "scripts/ci/verify-container.sh"
      - "scripts/ci/verify-docker-workspace.sh"
      - "scripts/ci/verify-nvim-lsp.lua"
      - "scripts/ci/check-docker.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-container:
    name: Clean C++26 Docker build and consumers
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate G5 configuration
        run: |
          set -euo pipefail
          python3 scripts/ci/check-docker.py
          python3 scripts/ci/check-makefile.py
          python3 scripts/ci/test-build-cache-guard.py
          python3 scripts/github/check-workflow-pins.py
          python3 scripts/github/check-workflow-security.py
          bash -n scripts/ci/verify-container.sh
          bash -n scripts/ci/verify-docker-workspace.sh

      - name: Build immutable reference image from a clean cache
        run: |
          set -euo pipefail
          make docker-build NO_CACHE=1

      - name: Verify installed environment and run canonical consumers
        run: |
          set -euo pipefail
          make docker-test

      - name: Verify writable Docker workspace, CMake database and Neovim clangd LSP
        run: |
          set -euo pipefail
          bash scripts/ci/verify-docker-workspace.sh
