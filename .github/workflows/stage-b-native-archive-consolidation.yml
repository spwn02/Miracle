name: Stage B Native Archive Consolidation

# One exact owner-authenticated command on Issue #69, no arbitrary IDs.
on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: miracle-stage-b-native-archive-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: >-
      github.repository == 'spwn02/Miracle' &&
      github.actor == 'spwn02' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 69 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/miracle-stage-b archive-plan-20261026' ||
       github.event.comment.body == '/miracle-stage-b archive-apply-20261026' ||
       github.event.comment.body == '/miracle-stage-b archive-restore-20261026')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout protected master without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned original full-body backup with repository-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity=$(gh api repos/spwn02/Miracle/actions/artifacts/12608038204 --jq '[.id,.name,.expired,.workflow_run.head_sha] | map(tostring) | join("|")')
          expected='12608038204|miracle-stage-b-full-draft-backup-40217537233|false|cd2c02b2691f32f6a624c32bfdef2f162bdf1aad'
          if [[ "$identity" != "$expected" ]]; then
            echo 'Original complete 172-body recovery artifact identity is invalid or expired' >&2
            exit 1
          fi
          gh run download 40217537233 --repo spwn02/Miracle --name miracle-stage-b-full-draft-backup-40217537233 --dir stage-b-draft-backup
          test -s stage-b-draft-backup/draft-body-backup-and-plan.json

      - name: Run exact selected archive operation with Projects-scoped credential
        env:
          GH_TOKEN: ${{ secrets.MIRACLE_PROJECT_TOKEN }}
          STAGE_B_COMMAND: ${{ github.event.comment.body }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Missing pre-existing restricted Project credential' >&2
            exit 1
          fi
          python3 -m py_compile scripts/github/stage-b-archive-consolidate.py
          python3 scripts/github/stage-b-archive-consolidate.py --self-test
          case "$STAGE_B_COMMAND" in
            '/miracle-stage-b archive-plan-20261026')
              python3 scripts/github/stage-b-archive-consolidate.py --plan ;;
            '/miracle-stage-b archive-apply-20261026')
              python3 scripts/github/stage-b-archive-consolidate.py --apply ;;
            '/miracle-stage-b archive-restore-20261026')
              python3 scripts/github/stage-b-archive-consolidate.py --restore ;;
            *) echo 'Refusing unrecognized owner command' >&2; exit 1 ;;
          esac

      - name: Upload exact-ID and body-hash evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miracle-stage-b-native-consolidation-${{ github.run_id }}
          path: stage-b-consolidation-evidence/
          retention-days: 90
          if-no-files-found: warn
