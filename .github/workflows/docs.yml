name: Documentation (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build canonical docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation builder
        run: python -m pip install --disable-pip-version-check "mkdocs==1.6.1"

      - name: Build site from tracked docs
        run: python -m mkdocs build --clean --strict

      - name: Check generated navigation and pages
        run: python scripts/docs/verify-site.py site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
