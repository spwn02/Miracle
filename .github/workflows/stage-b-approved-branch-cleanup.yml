name: Stage B Approved Branch Cleanup

# Single, exact, owner-only request in Stage B Issue #69. This intentionally
# does not accept arbitrary refnames, a variable batch, or workflow_dispatch.
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: miracle-stage-b-approved-branch-prune
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.repository == 'spwn02/Miracle' &&
      github.actor == 'spwn02' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 69 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/miracle-stage-b delete-approved-37-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout protected master without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate reviewed cleanup program and exact approval
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/github/stage-b-approved-branch-prune.py
          python3 scripts/github/stage-b-approved-branch-prune.py --self-test

      - name: Remove only approved branches with exact leases and recoverable refs
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          STAGE_B_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 scripts/github/stage-b-approved-branch-prune.py --apply-approved-37

      - name: Retain complete post-execution evidence even after a guarded failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miracle-stage-b-approved-branch-cleanup-${{ github.run_id }}
          path: stage-b-branch-cleanup-evidence/
          retention-days: 90
          if-no-files-found: warn
