name: Documentation (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "book.toml"
      - "theme/**"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "book.toml"
      - "theme/**"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build canonical docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install verified mdBook v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          version="v0.5.4"
          archive="mdbook-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/${version}/${archive}" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build Rust-style documentation from tracked docs
        run: mdbook build

      - name: Check generated navigation and pages
        run: python scripts/docs/verify-site.py site

      - name: Verify locked contract source-byte preservation
        run: |
          python3 scripts/docs/verify-frozen-contracts.py --self-test
          python3 scripts/docs/verify-frozen-contracts.py

      - name: Crawl all rendered site links, fragments and error-path fixtures
        run: |
          python3 scripts/docs/verify-links.py --self-test
          python3 scripts/docs/verify-links.py site

      - name: Probe all distinct external URLs before merging
        run: python3 scripts/docs/verify-links.py site --external

      - name: Prove locked-contract rendering in a throwaway copy only
        run: python3 scripts/docs/verify-contract-propagation.py

      - name: Test complete-chapter parity negative fixtures
        run: python3 scripts/docs/verify-published-content.py --self-test

      - name: Test public Pages probe using offline negative fixtures
        run: python3 scripts/docs/verify-live-site.py --self-test

      - name: Audit generated pages with Chromium accessibility tree and WCAG rules
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund             playwright-core@1.56.1 @axe-core/playwright@4.11.1
          node scripts/docs/verify-accessibility.cjs site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Checkout canonical source for post-deployment verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compare actual public Pages with canonical source and check external links
        run: python3 scripts/docs/verify-live-site.py

      - name: Rebuild canonical Pages with the exact pinned mdBook snapshot
        shell: bash
        run: |
          set -euo pipefail
          version="v0.5.4"
          archive="mdbook-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/${version}/${archive}" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Rebuild the public comparison baseline
        run: mdbook build

      - name: Verify all chapter bodies against public Pages
        run: python3 scripts/docs/verify-published-content.py

      - name: Check every external URL referenced in the generated site
        run: python3 scripts/docs/verify-links.py site --external
