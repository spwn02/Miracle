name: Documentation (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "book.toml"
      - "theme/**"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "book.toml"
      - "theme/**"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build canonical docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified mdBook v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          version="v0.5.4"
          archive="mdbook-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/${version}/${archive}" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build Rust-style documentation from tracked docs
        run: mdbook build

      - name: Check generated navigation and pages
        run: python scripts/docs/verify-site.py site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
