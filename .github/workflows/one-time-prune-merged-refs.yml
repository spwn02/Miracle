name: One-Time Approved Merged Scratch Branch Prune

on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: miracle-cleanup-exact-20261029
  cancel-in-progress: false
jobs:
  prune:
    if: >-
      github.repository == 'spwn02/Miracle' &&
      github.actor == 'spwn02' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 69 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/miracle-project prune-merged-scratch-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout protected master without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0
      - name: Delete exact reviewed merged branch tips with lease and recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,pathlib,sys,urllib.parse
          REPO='spwn02/Miracle'
          PINNED=[["docs/stage-b-native-history-closeout-audit-20261026","18a1d841737fa1a0ad8b3fc23b0bc71a1af1944d",82],["fix/stage-b-history-readback-convergence","e85f87197efb2c6b0776f505c09af15f6269d242",81],["infra/stage-b-approved-37-prune","2e69f178bf5f75abd24ab1f6d7ffcf93c451af02",77],["infra/stage-b-approved-archive-consolidation","4625f291fefc3e034baa89cfecd0fe9e483513a8",79],["infra/stage-b-issue-event-evidence","8d45bfa1eb3485db94a37035ff8ce0aa050e63f4",76],["infra/stage-b-native-historical-roadmap","b057563a3187871d2ba96d9dfc1db04aad3260da",80],["infra/stage-b-reviewed-batch-write-route","5720572ad22e59a0939c6be0a06e88cbccf0d687",75],["infra/stage-b-roadmap-archive-reconciliation","9285b6624b3f7c173150697f832ba914dc43d13c",78],["chore/remove-obsolete-project-automation","ef8b5c970e8d9b9f46c8f3d7ad9f889073cc698c",84]]
          SELF='chore/prune-merged-scratch-refs-20261029'
          state={'stage':'init','targets':[],'recovery':[],'deleted':[]}
          folder=pathlib.Path('branch-cleanup-evidence');folder.mkdir(exist_ok=True)
          def save(): (folder/'result.json').write_text(json.dumps(state,indent=2)+'\n')
          def cmd(args,optional=False):
           p=subprocess.run(args,capture_output=True,text=True)
           if p.returncode:
            if optional and 'HTTP 404' in p.stderr:return None
            raise RuntimeError('command failed '+str(args[:4])+' '+p.stderr[-350:])
           return p.stdout
          def api(path,method='GET',form=None,optional=False):
           args=['gh','api','-X',method,'repos/'+REPO+'/'+path]
           for k,v in (form or {}).items():args+=['-f',k+'='+v]
           r=cmd(args,optional);return json.loads(r) if r else None
          def getbranch(n):return api('branches/'+urllib.parse.quote(n,safe='/'),optional=True)
          def gettag(n):return api('git/ref/tags/'+n,optional=True)
          def check(n,sha,pr,opened):
           b=getbranch(n);p=api('pulls/'+str(pr));h=p.get('head') or {}
           if not b or b.get('protected') or b.get('name')!=n or b['commit']['sha']!=sha:raise RuntimeError('branch ref drift '+n)
           if not p.get('merged_at') or h.get('sha')!=sha or h.get('ref')!=n or (h.get('repo') or {}).get('full_name')!=REPO:raise RuntimeError('not exact merged PR '+n)
           if any((x.get('head') or {}).get('ref')==n for x in opened):raise RuntimeError('open PR dependency '+n)
          try:
           opened=api('pulls?state=open&per_page=100')
           if len(opened)>=100:raise RuntimeError('open PR list truncated')
           closed=api('pulls?state=closed&per_page=100')
           found=[x for x in closed if x.get('head',{}).get('ref')==SELF and x.get('merged_at')]
           if len(found)!=1:raise RuntimeError('one-off PR not uniquely merged')
           targets=PINNED+[(SELF,found[0]['head']['sha'],found[0]['number'])]
           if len(targets)!=10 or len({x[0] for x in targets})!=10:raise RuntimeError('target list drift')
           for n,s,p in targets:check(n,s,p,opened)
           for n in ('master','gcc','infra/living-development-workspace'):
            if not getbranch(n):raise RuntimeError('retained branch missing '+n)
           state['targets']=[{'name':n,'sha':s,'merged_pr':p} for n,s,p in targets]
           state['stage']='preflight_passed';save()
           for i,(n,s,p) in enumerate(targets,1):
            label='github-cleanup-20261029/'+str(i).zfill(2)
            ref=gettag(label)
            if not ref: api('git/refs','POST',{'ref':'refs/tags/'+label,'sha':s});ref=gettag(label)
            if not ref or ref['object']['sha']!=s:raise RuntimeError('recovery mismatch '+label)
            state['recovery'].append({'tag':label,'sha':s,'branch':n});save()
           state['stage']='recovery_verified';save()
           for n,s,p in targets:check(n,s,p,api('pulls?state=open&per_page=100'))
           cmd(['gh','auth','setup-git'])
           for i,(n,s,p) in enumerate(targets,1):
            check(n,s,p,api('pulls?state=open&per_page=100'))
            ref='refs/heads/'+n
            cmd(['git','push','--porcelain','--force-with-lease='+ref+':'+s,'https://github.com/'+REPO+'.git',':'+ref])
            if getbranch(n):raise RuntimeError('branch still present '+n)
            if gettag('github-cleanup-20261029/'+str(i).zfill(2))['object']['sha']!=s:raise RuntimeError('lost recovery '+n)
            state['deleted'].append({'name':n,'sha':s,'pr':p});state['stage']='deleting';save()
            print('DELETED',i,n,flush=True)
           names=[x['name'] for x in api('branches?per_page=100')]
           if set(names)!={'master','gcc','infra/living-development-workspace'}:raise RuntimeError('unexpected remaining branches '+str(names))
           state['remaining']=names;state['stage']='verified_complete';save()
           print('PASS 10/10 exact merged scratch refs deleted, 3 retained, 10 recoverable tags',flush=True)
          except Exception as e:
           save();print('STOP '+str(e),file=sys.stderr);raise SystemExit(1)
          PY
      - name: Retain deletion/recovery evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miracle-exact-merged-ref-prune-${{ github.run_id }}
          path: branch-cleanup-evidence/
          retention-days: 90
          if-no-files-found: warn
