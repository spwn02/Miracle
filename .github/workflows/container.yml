name: G5 reference container

on:
  push:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - "Makefile"
      - "scripts/ci/check-makefile.py"
      - ".github/workflows/container.yml"
      - "scripts/ci/verify-reference-toolchain.py"
      - "scripts/ci/verify-container.sh"
      - "scripts/ci/verify-devcontainer-lifecycle.sh"
      - "scripts/ci/check-devcontainer.py"
  pull_request:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - "Makefile"
      - "scripts/ci/check-makefile.py"
      - ".github/workflows/container.yml"
      - "scripts/ci/verify-reference-toolchain.py"
      - "scripts/ci/verify-container.sh"
      - "scripts/ci/verify-devcontainer-lifecycle.sh"
      - "scripts/ci/check-devcontainer.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-container:
    name: Clean C++26 Docker build and consumers
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate G5 configuration
        run: |
          set -euo pipefail
          python3 scripts/ci/check-devcontainer.py
          python3 scripts/ci/check-makefile.py
          python3 scripts/github/check-workflow-pins.py
          python3 scripts/github/check-workflow-security.py
          bash -n scripts/ci/verify-container.sh
          bash -n scripts/ci/verify-devcontainer-lifecycle.sh

      - name: Build immutable reference image from a clean cache
        run: |
          set -euo pipefail
          make docker-build NO_CACHE=1

      - name: Verify installed environment and run canonical consumers
        run: |
          set -euo pipefail
          make docker-test

      - name: Install version-pinned Dev Containers CLI
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --prefix "$RUNNER_TEMP/g5-devcontainer-cli" \
            --no-audit --no-fund @devcontainers/cli@0.89.0
          "$RUNNER_TEMP/g5-devcontainer-cli/node_modules/.bin/devcontainer" --version

      - name: Verify real headless devcontainer startup and restart persistence
        env:
          DEVCONTAINER_CLI: ${{ runner.temp }}/g5-devcontainer-cli/node_modules/.bin/devcontainer
        run: |
          set -euo pipefail
          bash scripts/ci/verify-devcontainer-lifecycle.sh
