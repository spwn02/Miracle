name: GCC compatibility

on:
  push:
    branches: [gcc]
  pull_request:
    branches: [gcc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc:
    name: GCC compatibility
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'gcc'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate GCC compatibility
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                base-devel ca-certificates cmake git ninja
              bash ./.github/scripts/validate-gcc.sh
            '

      - name: Measure GCC convergence
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin master:refs/remotes/origin/master
          python3 .github/scripts/report-gcc-convergence.py \
            --master origin/master \
            --gcc HEAD \
            --output "$RUNNER_TEMP/gcc-convergence.json"

      - name: Upload GCC convergence report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-convergence-${{ github.run_id }}
          path: ${{ runner.temp }}/gcc-convergence.json
          if-no-files-found: error
