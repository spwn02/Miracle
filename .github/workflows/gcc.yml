name: GCC compatibility

on:
  push:
    branches: [gcc]
  pull_request:
    branches: [gcc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc:
    name: GCC compatibility
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'gcc'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate GCC compatibility
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                base-devel ca-certificates cmake git ninja
              ./.github/scripts/validate-gcc.sh
            '
